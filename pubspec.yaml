name: cineus
description: "Cineus - Jogo diário de adivinhação de filmes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5+2
  path: ^1.9.1
  go_router: ^14.8.1
  share_plus: ^13.3.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  app_links: ^7.2.1
  url_launcher: 6.3.2
  flutter_svg: ^2.3.0
  http: 1.6.0
  cryptography: ^2.9.0
  flutter_secure_storage: 11.2.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4
  in_app_purchase_storekit: ^0.4.13+3
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs real SQLite in unit tests, so schema and queries are exercised for
  # real instead of being asserted against a hand-written fake.
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  # Generates AppL10n from lib/l10n/*.arb — see l10n.yaml.
  generate: true

  assets:
    - assets/daily/calendar_v1.json
    - assets/daily/themes_v1.json
    - assets/cineus_v1.db
    - assets/cineus_v1_seed.json
    - assets/posters/
    - assets/brand/
    - assets/credits/tmdb_official.png
    - assets/credits/colors_sources.json
    - assets/licenses/
    - assets/colors/training_v1.json
    - assets/colors/stages_v1.json
    - assets/colors/art/
    - assets/generated/icons/
    - assets/generated/illustrations/
    - assets/home/
    - assets/films/
    - assets/poster_stages/
    - assets/color_hub/
    - assets/match_cards/
    - assets/collection/
    - assets/commerce/

  # Fonts bundled locally, with official OFL notices.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
