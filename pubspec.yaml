name: cineus
description: "Cineus - Jogo diário de adivinhação de filmes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5+2
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  share_plus: ^13.3.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs real SQLite in unit tests, so schema and queries are exercised for
  # real instead of being asserted against a hand-written fake.
  sqflite_common_ffi: ^2.3.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppL10n from lib/l10n/*.arb — see l10n.yaml.
  generate: true

  assets:
    - assets/cineus_v1.db
    - assets/cineus_v1_seed.json
    - assets/posters/

  # Fonts are bundled, not downloaded at runtime.
  #
  # The app used `google_fonts`, which fetches from fonts.gstatic.com on first
  # launch. The release manifest has no INTERNET permission (Flutter only adds it
  # to debug/profile), so every release build silently fell back to the system
  # font and lost the entire type design. Bundling also suits an offline-first
  # game: no network, no flash of unstyled text.
  #
  # Playfair Display and Inter ship only as variable fonts upstream, so these are
  # static instances generated per weight; all files are subset to the characters
  # the app and the bundled catalogue actually use (3.2 MB -> 1.2 MB).
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-700Italic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlayfairDisplay-800.ttf
          weight: 800
        - asset: assets/fonts/PlayfairDisplay-800Italic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/PlayfairDisplay-900.ttf
          weight: 900
        - asset: assets/fonts/PlayfairDisplay-900Italic.ttf
          weight: 900
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-400Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-400.ttf
          weight: 400
        - asset: assets/fonts/DMMono-500.ttf
          weight: 500
