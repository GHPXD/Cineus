name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  commerce-backend:
    name: Commerce backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -c backend/pytest.ini backend/tests

  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate catalogue content version
        env:
          CINEUS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/validate_content_version.py --base-ref "$CINEUS_BASE_SHA"

      - name: Validate catalogue artifacts
        run: python3 scripts/validate_catalog.py

      - name: Validate published daily calendar
        run: python3 scripts/validate_daily_calendar.py

      - name: Validate release compliance
        run: python3 scripts/validate_release_compliance.py

      - name: Validate content rights evidence inventory
        run: python3 scripts/validate_content_rights.py

      - name: Verify generated artwork origins and coverage
        run: python3 scripts/validate_gpt_assets.py

      - name: Verify collection artwork origins and transparency
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 scripts/validate_collection_assets.py
          python3 scripts/validate_color_assets.py

      - name: Verify production source and asset coverage
        run: python3 scripts/validate_project_usage.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          actual="$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
          test "$actual" = "$FLUTTER_VERSION"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is current
        shell: bash
        run: |
          set -euo pipefail
          git diff -- pubspec.lock analysis_options.yaml
          git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Verify generated localizations are current
        shell: bash
        run: |
          set -euo pipefail
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/app_l10n*.dart

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Test suite
        run: flutter test

      - name: Decode generated SVG artwork with Flutter
        run: flutter test scripts/gpt_svg_decode_test.dart --no-pub

      - name: Decode all character layers with matching frames
        run: flutter test scripts/color_art_decode_test.dart --no-pub

  web:
    name: Web release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-pub

  android:
    name: Android API 36 release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      # Explicit validation-only exception. Local/publishing release builds fail
      # closed unless a real android/key.properties is present.
      CINEUS_ALLOW_DEBUG_SIGNED_RELEASE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Android release baseline
        shell: bash
        run: |
          set -euo pipefail
          java -version
          grep -Fq 'compileSdk = 36' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -Fq 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -Fq 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'version "9.1.0"' android/settings.gradle.kts
          grep -Fq 'version "2.4.0"' android/settings.gradle.kts
          grep -Fq 'CINEUS_ALLOW_DEBUG_SIGNED_RELEASE' android/app/build.gradle.kts
          grep -Fq 'throw GradleException' android/app/build.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Verify reflective Android startup constructors
        run: python3 scripts/verify_android_startup.py build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS 26 SDK release build
    runs-on: macos-26
    timeout-minutes: 35
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          sdk_major="${sdk_version%%.*}"
          test "$xcode_major" -ge 26
          test "$sdk_major" -ge 26
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET=15.0' ios/Flutter/Release.xcconfig

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
