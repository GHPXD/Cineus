name: CI

on:
  push:
    branches:
      - main
      - chore/phase-0-release-toolchain
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          actual="$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')"
          test "$actual" = "$FLUTTER_VERSION"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Test suite
        run: flutter test

  web:
    name: Web release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-pub

  android:
    name: Android API 36 release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Android release baseline
        shell: bash
        run: |
          set -euo pipefail
          java -version
          grep -Fq 'compileSdk = 36' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -Fq 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'version "9.1.0"' android/settings.gradle.kts
          grep -Fq 'version "2.4.0"' android/settings.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub

  ios:
    name: iOS 26 SDK release build
    runs-on: macos-26
    timeout-minutes: 35
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          sdk_major="${sdk_version%%.*}"
          test "$xcode_major" -ge 26
          test "$sdk_major" -ge 26
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET=15.0' ios/Flutter/Release.xcconfig

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
