name: Catalog localization infrastructure

on:
  push:
    branches: [agent/release-hardening]

permissions:
  contents: write

jobs:
  localize-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply catalog localization patch
        run: python tool/catalog_localization_patch.py

      - name: Resolve and generate localization
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format and validate scripts
        run: |
          dart format lib test
          python -m py_compile scripts/import_catalog_localizations.py

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build Android release
        run: flutter build apk --release

      - name: Commit validated localization infrastructure
        run: |
          rm .github/workflows/catalog-localization.yml
          rm tool/catalog_localization_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "prepare catalogue localization"
          git push origin HEAD:agent/release-hardening
