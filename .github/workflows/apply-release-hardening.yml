name: Apply release hardening

on:
  push:
    branches: [agent/release-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Apply release-hardening patches
        run: python tool/apply_release_hardening.py

      - name: Resolve dependencies and generate localization
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Commit validated hardening
        run: |
          rm .github/workflows/apply-release-hardening.yml
          rm tool/apply_release_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete release hardening"
          git push origin HEAD:agent/release-hardening
