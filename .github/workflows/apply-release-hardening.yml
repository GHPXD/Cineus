name: Apply release hardening

on:
  push:
    branches: [agent/release-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Repair generator quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_release_hardening.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("r'''", 'r"""')
          text = text.replace("\n'''\n", '\n"""\n')
          text = text.replace("\n''',\n", '\n""",\n')
          text = text.replace('    "lib/presentation/screens/generic_stages_screen.dart",\n', '')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tool/apply_release_hardening.py

      - name: Apply release-hardening patches
        run: |
          python tool/apply_release_hardening.py
          python - <<'PY'
          from pathlib import Path

          stages = Path('lib/presentation/screens/generic_stages_screen.dart')
          text = stages.read_text(encoding='utf-8')
          old = r"l10n.errorWithMessage('\$e')"
          if old not in text:
              raise SystemExit('escaped stages error placeholder not found')
          stages.write_text(text.replace(old, 'l10n.genericLoadError'), encoding='utf-8')

          rollback = Path('test/reward_rollback_test.dart')
          text = rollback.read_text(encoding='utf-8')
          text = text.replace("import 'package:cineus/domain/entities/ticket_reward.dart';\n", '')
          rollback.write_text(text, encoding='utf-8')

          normalizer = Path('test/string_normalizer_test.dart')
          text = normalizer.read_text(encoding='utf-8')
          old = "'spiderman no way home'"
          if text.count(old) != 1:
              raise SystemExit(f'normalizer expectation count was {text.count(old)}')
          normalizer.write_text(text.replace(old, "'spider man no way home'"), encoding='utf-8')

          upgrade = Path('test/content_upgrade_test.dart')
          text = upgrade.read_text(encoding='utf-8')
          old = 'final source = await factory.openDatabase(inMemoryDatabasePath);'
          target_clues = """await db.execute('''
        CREATE TABLE IF NOT EXISTS clues (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          movie_id INTEGER NOT NULL,
          clue_number INTEGER NOT NULL,
          category TEXT NOT NULL,
          text TEXT NOT NULL
        )
      ''');

      """
          if text.count(old) != 1:
              raise SystemExit(f'content upgrade source setup count was {text.count(old)}')
          text = text.replace(old, target_clues + old)
          old = 'final source = await factory.openDatabase(inMemoryDatabasePath);'
          new = """final source = await factory.openDatabase(
            inMemoryDatabasePath,
            options: OpenDatabaseOptions(singleInstance: false),
          );"""
          upgrade.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Resolve dependencies and generate localization
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Commit validated hardening
        run: |
          rm .github/workflows/apply-release-hardening.yml
          rm tool/apply_release_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete release hardening"
          git push origin HEAD:agent/release-hardening
