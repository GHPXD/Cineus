name: Upgrade dependencies

on:
  push:
    branches: [agent/release-hardening]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply dependency migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          replacements = {
              'flutter_riverpod: ^2.6.1': 'flutter_riverpod: ^3.4.2',
              'sqflite: ^2.4.2': 'sqflite: ^2.4.3',
              'sqflite_common_ffi_web: ^0.4.5+2': 'sqflite_common_ffi_web: ^1.1.2',
              'go_router: ^14.8.1': 'go_router: ^17.5.0',
              'share_plus: ^10.1.4': 'share_plus: ^13.3.0',
              'flutter_local_notifications: ^22.2.0': 'flutter_local_notifications: ^22.3.0',
              'flutter_lints: ^5.0.0': 'flutter_lints: ^6.0.0',
              'sqflite_common_ffi: ^2.3.6': 'sqflite_common_ffi: ^2.4.2',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing pubspec constraint: {old}')
              text = text.replace(old, new)
          pubspec.write_text(text, encoding='utf-8')

          # Riverpod 3 keeps StateNotifier-family providers in legacy.dart.
          legacy_symbols = ('StateNotifier', 'StateNotifierProvider', 'StateProvider', 'ChangeNotifierProvider')
          for path in Path('lib').rglob('*.dart'):
              source = path.read_text(encoding='utf-8')
              if not any(symbol in source for symbol in legacy_symbols):
                  continue
              if "package:flutter_riverpod/legacy.dart" not in source:
                  marker = "import 'package:flutter_riverpod/flutter_riverpod.dart';"
                  if marker not in source:
                      raise SystemExit(f'legacy Riverpod symbol without standard import: {path}')
                  source = source.replace(
                      marker,
                      marker + "\nimport 'package:flutter_riverpod/legacy.dart';",
                      1,
                  )
              path.write_text(source, encoding='utf-8')

          # Riverpod 3 renamed AsyncValue.valueOrNull to value.
          for path in Path('lib').rglob('*.dart'):
              source = path.read_text(encoding='utf-8')
              if '.valueOrNull' in source:
                  path.write_text(source.replace('.valueOrNull', '.value'), encoding='utf-8')

          # share_plus 13 uses the instance API + ShareParams.
          share = Path('lib/presentation/screens/generic_result_screen.dart')
          source = share.read_text(encoding='utf-8')
          source = source.replace(
              "final result = await Share.share(text, subject: 'Cineus');",
              "final result = await SharePlus.instance.share(\n"
              "        ShareParams(text: text, subject: 'Cineus'),\n"
              "      );",
          )
          source = source.replace(
              "await Share.share(text, subject: 'Cineus');",
              "await SharePlus.instance.share(\n"
              "        ShareParams(text: text, subject: 'Cineus'),\n"
              "      );",
          )
          if 'Share.share(' in source:
              raise SystemExit('legacy Share.share call remains')
          share.write_text(source, encoding='utf-8')
          PY

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build Android release
        run: flutter build apk --release

      - name: Commit validated dependency upgrade
        run: |
          rm .github/workflows/upgrade-dependencies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "upgrade Flutter dependencies"
          git push origin HEAD:agent/release-hardening
