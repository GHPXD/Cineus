name: Phase 0 dependency migration

on:
  push:
    branches:
      - chore/phase-0-release-toolchain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: chore/phase-0-release-toolchain

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Upgrade share_plus and migrate API
        shell: python
        run: |
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old = '  share_plus: ^10.1.4'
          new = '  share_plus: ^13.3.0'
          if old not in text and new not in text:
              raise SystemExit('Unexpected share_plus constraint')
          pubspec.write_text(text.replace(old, new), encoding='utf-8')

          result = Path('lib/presentation/screens/generic_result_screen.dart')
          text = result.read_text(encoding='utf-8')
          text = text.replace(
              "final result = await Share.share(text, subject: 'Cineus');",
              "final result = await SharePlus.instance.share(\n"
              "        ShareParams(text: text, subject: 'Cineus'),\n"
              "      );",
          )
          text = text.replace(
              "await Share.share(text, subject: 'Cineus');",
              "await SharePlus.instance.share(\n"
              "        ShareParams(text: text, subject: 'Cineus'),\n"
              "      );",
          )
          if 'Share.share(' in text:
              raise SystemExit('Legacy Share.share API still present')
          result.write_text(text, encoding='utf-8')

      - name: Regenerate lockfile
        run: flutter pub get

      - name: Format migrated Dart file
        run: dart format lib/presentation/screens/generic_result_screen.dart

      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock lib/presentation/screens/generic_result_screen.dart analysis_options.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency migration changes required.'
            exit 0
          fi
          git commit -m 'chore(deps): align sharing stack with Flutter 3.47'
          git push origin HEAD:chore/phase-0-release-toolchain
