# Localisation codegen (D9).
#
# Portuguese is the template: it is the language the app was written in, so a new
# key is added there first and the analyzer then flags the other locales.
arb-dir: lib/l10n
template-arb-file: app_pt.arb
output-localization-file: app_l10n.dart
output-class: AppL10n
nullable-getter: false
